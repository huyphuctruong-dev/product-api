name: Product API CD - Docker Hub

on:
  workflow_run:
    workflows:
      - Product API Production CI
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

jobs:
  docker:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/product-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/product-api:${{ github.event.workflow_run.head_sha }}

      - name: Deployment summary
        run: |
          echo "CI healthcheck and CRUD tests passed."
          echo "Docker image pushed to Docker Hub."
          echo "Image: ${{ secrets.DOCKERHUB_USERNAME }}/product-api:latest"